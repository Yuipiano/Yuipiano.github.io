<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yui Nakamoto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">Yui Nakamoto</div>
        <nav>
            <ul>
                <li><a href="index.html">Main page</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <ul>
                <li>
                    <a href="https://twitter.com/yuipianississis">
                    <img src="figs/logo-x.png" alt="X logo" height="14"/>
                </a>
                </li>
                <li>
                    <a href="https://www.instagram.com/yui_nakamoto_/">
                        <img src="figs/logo-ig-color.png" alt="IG logo" height="16"/>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="lesson">
            <h1>Lesson</h1>
            <!-- <img src="figs/profile.jpg" alt="Profile image" class="profile-pic">
            <div class="profile-container"> -->
                <p>
                    中野区内にてピアノレッスンを承っております。
                    <br>
                    下記フォームよりお気軽にご連絡ください。
                </p>
            </div>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <form action="https://formspree.io/f/mjkkbdvg" method="post">
                <label for="name">お名前</label>
                <input type="text" id="name" name="name" placeholder="例：山田 太郎" required>

                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" required>

                <label for="child">お子さまの場合：お名前・年齢</label>
                <input type="text" id="child" name="child" placeholder="例：山田 花子（5歳）">

                <span class="form-label">ピアノのご経験</span>
                <div class="inquiry-radio-group">
                    <label><input type="radio" name="experience" value="はじめて" checked> はじめて</label>
                    <label><input type="radio" name="experience" value="経験あり"> 経験あり（<input type="text" name="experience_years" class="inquiry-years-input" placeholder="3"> 年程度）</label>
                </div>

                <span class="form-label">ご希望の内容</span>
                <div class="inquiry-radio-group">
                    <label><input type="radio" name="request_type" value="体験レッスン" checked> 体験レッスン</label>
                    <label><input type="radio" name="request_type" value="入会について"> 入会について</label>
                    <label><input type="radio" name="request_type" value="その他"> その他</label>
                </div>

                <label for="time">ご希望の曜日・時間帯</label>
                <input type="text" id="time" name="time" placeholder="例：土曜午前">

                <label for="message">メッセージ・ご質問</label>
                <textarea id="message" name="message" rows="5" placeholder="ご質問やご相談内容があればご記入ください" required></textarea>

                <button type="submit">送信</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Yui Nakamoto. All Rights Reserved.</p>
        <div class="social-links">
            <a href="https://twitter.com/yuipianississis">
                <img src="figs/logo-x.png" alt="X logo" height="16"/>
            </a>
            <a href="https://www.instagram.com/yui_nakamoto_/">
                <img src="figs/logo-ig-color.png" alt="IG logo" height="18"/>
            </a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
